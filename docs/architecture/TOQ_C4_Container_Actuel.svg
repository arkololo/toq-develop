<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1190" viewBox="0 0 1880 1190" role="img" aria-labelledby="title desc">
<title id="title">TOQ — architecture actuelle, diagramme C4 Container</title>
<desc id="desc">Un navigateur accède au frontend React servi par Nginx et à Keycloak. Nginx route vers cinq services Spring Boot. Keycloak et les services utilisent six bases logiques dans une instance PostgreSQL. User appelle Gemini, Recipe appelle TheMealDB, Nutrition appelle Open Food Facts. CIQUAL est stocké localement.</desc>
