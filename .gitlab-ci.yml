stages:
  - validate
  - test
  - build

default:
  tags:
    - toq-deploy
  interruptible: true

workflow:
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == "develop"'

backend:
  stage: test
  cache:
    key: maven-phase1
    paths:
      - .m2/repository/
  script:
    - |
      docker run --rm \
        --user "$(id -u):$(id -g)" \
        --env HOME=/tmp \
        --env MAVEN_OPTS="-Duser.home=/tmp -Dmaven.repo.local=/workspace/.m2/repository" \
        --mount "type=bind,source=$CI_PROJECT_DIR,target=/workspace" \
        --workdir /workspace \
        maven:3.9.12-eclipse-temurin-21@sha256:c3c9d3ac4ce8431a3995c0318b8d390f448e693dd4fabc16e9b68d2e1f3d7b46 \
        sh ./mvnw --batch-mode --no-transfer-progress verify
  artifacts:
    when: always
    reports:
      junit: services/*/target/surefire-reports/TEST-*.xml

frontend:
  stage: validate
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  script:
    - |
      docker run --rm \
        --user "$(id -u):$(id -g)" \
        --env HOME=/tmp \
        --mount "type=bind,source=$CI_PROJECT_DIR,target=/workspace" \
        --workdir /workspace/frontend \
        node:22.23.2-alpine@sha256:b6f26b36c8ff49624cfdac716b8ea1138d606df02586a77d364bb5536a634f85 \
        sh -ec '
          npm ci --cache .npm --prefer-offline
          npm run lint
          npm run test -- --run
          npm audit --audit-level=high --omit=dev
          npm run build
        '

images-locales:
  stage: build
  needs: [backend, frontend]
  script:
    - sh scripts/setup-local.sh
    - docker compose config --quiet
    - docker compose --parallel 2 build 