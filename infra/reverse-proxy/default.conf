# Included by the unprivileged Nginx image in its http context.
# Deliberately omit query strings, tokens and cookies from the access log.
log_format toq '$remote_addr - $request_method $uri $status $body_bytes_sent $request_time';

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /dev/stdout toq;
    error_log /dev/stderr warn;

    client_max_body_size 4m;
    client_body_timeout 10s;
    send_timeout 10s;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://www.themealdb.com; font-src 'self'; connect-src 'self' http://localhost:8081; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    # Regex order matters: management paths are rejected even beneath an API.
    location ~* (^|/)(actuator|internal)(/|$) { return 404; }
    location ~ /\. { return 404; }

    location ~ ^/api/v1/users(?:/|$) {
        proxy_pass http://user-service:8080;
    }
    location ~ ^/api/v1/assistant(?:/|$) {
        client_max_body_size 16k;
        proxy_read_timeout 75s;
        proxy_pass http://user-service:8080;
    }
    location ~ ^/api/v1/(recipes|ingredients)(?:/|$) {
        proxy_pass http://recipe-service:8080;
    }
    location ~ ^/api/v1/nutrition(?:/|$) {
        proxy_pass http://nutrition-service:8080;
    }
    location ~ ^/api/v1/(plans|shopping-lists)(?:/|$) {
        proxy_pass http://planner-service:8080;
    }
    location ~ ^/api/v1/social(?:/|$) {
        proxy_pass http://social-service:8080;
    }
    location ~ ^/api(?:/|$) { return 404; }

    location /assets/ {
        try_files $uri =404;
        expires 1h;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
